name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck, lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: test
    # /sitemap.xml é gerado estaticamente no build e busca canais reais
    # do Supabase (lib/api/get-catalog.ts) — sem essas duas secrets no
    # repositório (Settings > Secrets and variables > Actions) o build
    # falha. São os mesmos valores já usados no projeto Vercel — seguros
    # por design (NEXT_PUBLIC_*, expostos a qualquer visitante do site;
    # RLS protege o dado).
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
